services:
  db:
    image: mysql:8
    container_name: doctor_saas_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: doctor_saas
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: doctor_saas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  db_data:
